name: my-ci-pipeline
on:
  push:
    branches:
      - main
jobs:
  checkout-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        
  build-job:
    needs: checkout-job
    runs-on: ubuntu-latest
    steps:
      - name: Build using maven
        run: echo "Application Building"
        
  test-job:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: Test using Sonarqube
        run: echo "SonarQube Testing"
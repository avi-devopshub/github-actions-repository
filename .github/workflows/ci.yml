name: ci-pipeline
on:
  push:
    branches:
      - main
jobs:
  my-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build
        run: echo "Building Application"

      - name: Test
        run: echo "Testing Application"
      
      - name: Check files
        run: ls -al

      - name: Check current directory
        run: pwd

      - name: Check Git status
        run: git status